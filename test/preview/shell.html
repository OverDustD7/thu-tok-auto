<!doctype html>
<html lang="zh-CN" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THU Tok Auto — isolated preview</title>
<style>
  /* Shell only. The widget brings its own stylesheet (lib/ui.js). */
  :root { color-scheme: light; --bg:#f6f6f7; --panel:#fff; --line:#e3e3e6; --ink:#1f2023; --dim:#6b6f76; --accent:#5b8def; }
  html[data-scheme="dark"] { color-scheme: dark; --bg:#1b1b1e; --panel:#232326; --line:#34343a; --ink:#eceef1; --dim:#9aa0a6; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  .app { display:flex; min-height:100vh; }
  .sidebar { width:260px; flex:none; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  .sidebar__head { padding:10px 12px; font-weight:600; border-bottom:1px solid var(--line); }
  .sidebar__body { flex:1; padding:8px 6px; overflow:hidden; }
  .row { padding:7px 9px; border-radius:8px; color:var(--dim); }
  .row.active { background:rgba(91,141,239,.14); color:var(--ink); }
  /* Mirrors the Harness footer: the widget mounts as the first child above these. */
  .sidebar_footArea { padding:6px 10px 8px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:12px; }
  .foot { display:inline-flex; align-items:center; gap:6px; font-size:14px; padding:2px 8px; border-radius:6px; border:1px solid transparent; background:transparent; color:inherit; }
  .foot .ico { width:16px; text-align:center; }
  .main { flex:1; display:flex; flex-direction:column; }
  .main__body { flex:1; padding:18px; color:var(--dim); }
  .bar { border-top:1px solid var(--line); padding:10px 14px; display:flex; flex-wrap:wrap; gap:8px; background:var(--panel); }
  .bar button, .bar a { font:inherit; font-size:13px; padding:2px 8px; border-radius:6px; border:1px solid var(--line); background:transparent; color:inherit; text-decoration:none; cursor:pointer; }
  .bar .on { border-color:var(--accent); color:var(--accent); }
  .note { padding:10px 14px; border-top:1px solid var(--line); color:var(--dim); font-size:12px; }
  code { font-family:ui-monospace,Consolas,monospace; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__head">DeepSeek Harness</div>
    <div class="sidebar__body">
      <div class="row active">madmodel 网关排查</div>
      <div class="row">课表与选课</div>
      <div class="row">站点内容插件</div>
    </div>
    <div class="sidebar_footArea">
      <button class="foot" type="button"><span class="ico">◎</span><span class="lbl">Remote</span></button>
      <button class="foot" type="button" aria-label="Settings"><span class="ico">⚙</span><span class="lbl">Settings</span></button>
    </div>
  </aside>
  <main class="main">
    <div class="main__body">
      <p>这是一个隔离预览外壳：它只提供 <code>lib/ui.js</code> 和假的、脱敏的状态快照，
      不连接真实认证，也不读写任何凭据。左侧页脚里的控件就是插件实际注入的那一份。</p>
    </div>
    <div class="bar" id="bar"></div>
    <div class="note">数据来源：<span id="source">—</span>　深色规则处理：<span id="flatten">—</span></div>
  </main>
</div>
<script>
  // Scenario must be decided BEFORE ui.js boots, hence the synchronous request:
  // this is a dev harness, and the ordering is the whole point of it.
  var params = new URLSearchParams(location.search)
  var scenario = params.get('scenario') || 'ok'
  var scheme = params.get('scheme') || 'light'
  var width = Number(params.get('width') || 260)
  document.documentElement.dataset.scheme = scheme
  var xhr = new XMLHttpRequest()
  xhr.open('GET', '/__scenario?name=' + encodeURIComponent(scenario), false)
  xhr.send()
  document.getElementById('source').textContent = '/thu-tok-auto/api/status → ' + scenario
  addEventListener('DOMContentLoaded', function () {
    document.getElementById('sidebar').style.width = width + 'px'
    var bar = document.getElementById('bar')
    var q = function (patch) {
      var p = new URLSearchParams(location.search)
      Object.keys(patch).forEach(function (k) { p.set(k, patch[k]) })
      location.search = p.toString()
    }
    ;['ok', 'no-progress', 'partial', 'needs-login', 'offline', 'expired', 'busy', 'idle', 'long'].forEach(function (name) {
      var b = document.createElement('button')
      b.textContent = name
      if (name === scenario) b.className = 'on'
      b.onclick = function () { q({ scenario: name }) }
      bar.appendChild(b)
    })
    ;['light', 'dark'].forEach(function (name) {
      var b = document.createElement('button')
      b.textContent = name
      if (name === scheme) b.className = 'on'
      b.onclick = function () { q({ scheme: name }) }
      bar.appendChild(b)
    })
    ;[280, 260, 200, 54].forEach(function (w) {
      var b = document.createElement('button')
      b.textContent = w + 'px'
      if (w === width) b.className = 'on'
      b.onclick = function () { q({ width: String(w) }) }
      bar.appendChild(b)
    })
  })
  // The browser tooling cannot emulate an OS-level prefers-color-scheme, so for the
  // dark render we lift the SHIPPED dark rules out of their media block verbatim
  // (no value is retyped here). Nothing else in the preview rewrites widget styles.
  function flattenShippedDarkRules() {
    var flattened = 0
    for (var s = 0; s < document.styleSheets.length; s++) {
      var sheet = document.styleSheets[s]
      var rules
      try { rules = sheet.cssRules } catch (e) { continue }
      var media = []
      for (var i = 0; i < rules.length; i++) {
        var rule = rules[i]
        if (rule.type === CSSRule.MEDIA_RULE && /prefers-color-scheme:\s*dark/.test(rule.conditionText || rule.media.mediaText)) media.push(rule)
      }
      for (var m = 0; m < media.length; m++) {
        var inner = media[m].cssRules
        for (var j = 0; j < inner.length; j++) sheet.insertRule(inner[j].cssText, sheet.cssRules.length)
        flattened += inner.length
        sheet.deleteRule(Array.prototype.indexOf.call(sheet.cssRules, media[m]))
      }
    }
    window.__mmtokPreviewFlattened = flattened
    document.getElementById('flatten').textContent = flattened
      ? '已展开 ' + flattened + ' 条 shipped 深色规则（媒体查询被浏览器工具限制，改用等价展开）'
      : '无（浅色）'
  }
  // ?measure=1 renders a numeric report of the widget's geometry into the page so
  // a headless browser can dump it. Numbers, not eyeballs: alignment and overflow
  // are decided by getBoundingClientRect(), never by looking at a screenshot.
  function measure() {
    // The harness that reads this dump is Windows PowerShell 5.1, which would
    // mangle UTF-8; escape every non-ASCII character so the report is pure ASCII.
    var esc = function (v) {
      if (typeof v !== 'string') return v
      return v.replace(/[^\x20-\x7E]/g, function (ch) {
        return '\\u' + ('000' + ch.charCodeAt(0).toString(16)).slice(-4)
      })
    }
    var rect = function (el) {
      if (!el) return null
      var b = el.getBoundingClientRect()
      return { x: +b.x.toFixed(1), y: +b.y.toFixed(1), w: +b.width.toFixed(1), h: +b.height.toFixed(1),
               right: +b.right.toFixed(1), bottom: +b.bottom.toFixed(1),
               cx: +(b.x + b.width / 2).toFixed(1), cy: +(b.y + b.height / 2).toFixed(1) }
    }
    var one = function (sel) { return document.querySelector(sel) }
    var cs = function (el) { return el ? getComputedStyle(el) : null }
    var box = one('.mmtok-box')
    var dot = one('.mmtok-dot')
    var state = one('.mmtok-state')
    var elapsed = one('.mmtok-elapsed')
    var btns = document.querySelectorAll('.mmtok-btns button')
    var get = btns[0]
    var auto = btns[1]
    var boxRect = rect(box)
    var spills = []
    if (box) {
      Array.prototype.forEach.call(box.querySelectorAll('*'), function (el) {
        var b = el.getBoundingClientRect()
        if (b.width && (b.right > boxRect.right + 0.5 || b.left < boxRect.left - 0.5)) {
          spills.push(esc((el.className || el.tagName) + ' at ' + b.left.toFixed(1) + '..' + b.right.toFixed(1)))
        }
      })
    }
    return {
      scenario: scenario, scheme: scheme, width: width,
      viewport: { w: innerWidth, h: innerHeight },
      sidebar: rect(one('#sidebar')),
      footArea: rect(one('.sidebar_footArea')),
      // The widget must follow ITS container, not the viewport: both are reported so a
      // narrow window with an expanded sidebar can be told apart from a collapsed rail.
      hostArea: rect(box && box.parentNode),
      hostClientW: box && box.parentNode ? box.parentNode.clientWidth : null,
      boxClass: esc(box && box.className),
      box: boxRect,
      boxPad: cs(box) ? [cs(box).paddingTop, cs(box).paddingRight, cs(box).paddingBottom, cs(box).paddingLeft] : null,
      dot: rect(dot), dotColour: cs(dot) && cs(dot).backgroundColor, dotClass: dot && dot.className,
      dotAria: esc(dot && dot.getAttribute('aria-label')),
      get: rect(get), auto: rect(auto), elapsed: rect(elapsed),
      footIcon: rect(one('.foot .ico')), footLabel: rect(one('.foot .lbl')),
      getText: esc(get && get.textContent), getDisabled: get && get.disabled,
      getAriaBusy: get && get.getAttribute('aria-busy'),
      autoText: esc(auto && auto.textContent), autoPressed: auto && auto.getAttribute('aria-pressed'),
      state: rect(state), stateText: esc(state && state.textContent), stateClass: esc(state && state.className),
      stateColour: cs(state) && cs(state).color, stateLive: state && state.getAttribute('aria-live'),
      stateDisplay: cs(state) && cs(state).display, stateMaxH: cs(state) && cs(state).maxHeight,
      stateClip: cs(state) && cs(state).clipPath,
      elapsedText: esc(elapsed && elapsed.textContent), elapsedAria: esc(elapsed && elapsed.getAttribute('aria-label')),
      fontSize: { box: cs(box) && cs(box).fontSize, btn: cs(get) && cs(get).fontSize,
                  elapsed: cs(elapsed) && cs(elapsed).fontSize, state: cs(state) && cs(state).fontSize },
      overflow: box ? { scrollW: box.scrollWidth, clientW: box.clientWidth,
                        spills: box.scrollWidth > box.clientWidth + 1 ? 'box' : 'none', children: spills } : null,
      flattenedDarkRules: window.__mmtokPreviewFlattened || 0,
    }
  }
  addEventListener('load', function () {
    if (scheme === 'dark') setTimeout(flattenShippedDarkRules, 0)
    else document.getElementById('flatten').textContent = '无（浅色）'
    if (!params.has('measure')) return
    setTimeout(function () {
      var pre = document.createElement('pre')
      pre.id = 'measure'
      pre.textContent = JSON.stringify(measure(), null, 1)
      document.body.appendChild(pre)
    }, 1500)
  })
</script>
<script src="/thu-tok-auto/ui.js"></script>
</body>
</html>
